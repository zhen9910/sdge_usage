<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SDGE Usage Analyzer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="card-title h4 mb-1">SDGE Usage Analyzer</h1>
            <p class="text-muted small mb-4">TOU-DR1 plan &mdash; Super Off-Peak / Off-Peak / On-Peak breakdown</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% for category, message in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                  {{ message }}
                  <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
              {% endfor %}
            {% endwith %}

            <form method="post" enctype="multipart/form-data">
              <div class="mb-3">
                <label for="file" class="form-label fw-semibold">Upload usage file</label>
                <input class="form-control" type="file" id="file" name="file" accept=".csv,.xlsx">
                <div class="form-text">Accepts SDGE 15-minute interval exports (.csv or .xlsx)</div>
              </div>
              <button type="submit" class="btn btn-primary w-100">Analyze</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
