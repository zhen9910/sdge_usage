<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connecting to SDGE…</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow-sm">
          <div class="card-body p-4 text-center">
            <div class="spinner-border text-primary mb-3" role="status"></div>
            <h1 class="h5 mb-1">Opening browser for SDGE login…</h1>
            <p class="text-muted small mb-0">
              A browser window is opening so you can log in to My Energy Center.
              This page will update automatically once you're logged in.
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Auto-submit the login POST as soon as this page renders. -->
  <form id="f" method="post" action="{{ url_for('connect_sdge') }}"></form>
  <script>document.getElementById('f').submit();</script>
</body>
</html>
